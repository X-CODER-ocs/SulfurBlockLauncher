name: publish/nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "00 20 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_json: ${{ steps.meta.outputs.json }}
      app_version: ${{ steps.meta.outputs.app_version }}
      commit: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for Recent Commits
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE_TIME=$(date -u -d '24 hours ago' +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_COUNT=$(git log --since="$SINCE_TIME" --oneline | wc -l)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            gh run cancel ${{ github.run_id }}
            sleep 10
          fi

      - name: Generate Meta and JSON
        id: meta
        run: |
          BASE_VERSION=$(cat ./assets/conf/version.txt | tr -d '[:space:]')
          Y_FULL=$(TZ='Asia/Shanghai' date +'%Y')
          MD=$(TZ='Asia/Shanghai' date +'%m%d')
          HM=$(TZ='Asia/Shanghai' date +'%H%M')
          FULL_TIMESTAMP="${Y_FULL}${MD}${HM}"
          START_EPOCH=$(TZ='Asia/Shanghai' date -d "2026-07-10 00:00:00" +%s)
          NOW_EPOCH=$(date +%s)
          TOTAL_MINUTES=$(( (NOW_EPOCH - START_EPOCH) / 60 ))
          TOTAL_DAYS=$(( TOTAL_MINUTES / 1440 ))
          ELAPSED_HOURS=$(( (TOTAL_MINUTES % 1440) / 60 ))
          ELAPSED_MINUTES=$(( TOTAL_MINUTES % 60 ))
          APP_VERSION="0.${TOTAL_DAYS}.${ELAPSED_HOURS}.${ELAPSED_MINUTES}"
          COMMIT_HASH=$(git rev-parse --short=6 HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date -Iseconds)
          VERSION_TITLE="build-nightly-${APP_VERSION}-${{ github.run_id }}-${COMMIT_HASH}"
          JSON_STRING="{\"type\":\"nightly\",\"build-time\":\"${BUILD_TIME}\",\"action\":\"${{ github.run_id }}\",\"commit\":\"${COMMIT_HASH}\",\"version\":\"${BASE_VERSION}\",\"timestamp\":\"${FULL_TIMESTAMP}\",\"version_title\":\"${VERSION_TITLE}\"}"
          echo "json=${JSON_STRING}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT

  linux-package:
    runs-on: ubuntu-22.04
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      matrix:
        include:
          - kind: appimage
            package_type: appimage
            runtime: linux-x64
            output: SulfurLauncher.linux.x64.AppImage
          - kind: deb
            package_type: deb
            runtime: linux-x64
            output: SulfurLauncher.linux.x64.deb
          - kind: rpm
            package_type: rpm
            runtime: linux-x64
            output: SulfurLauncher.linux.x64.rpm
          - kind: appimage
            package_type: appimage
            runtime: linux-arm64
            output: SulfurLauncher.linux.arm64.AppImage
          - kind: deb
            package_type: deb
            runtime: linux-arm64
            output: SulfurLauncher.linux.arm64.deb
          - kind: rpm
            package_type: rpm
            runtime: linux-arm64
            output: SulfurLauncher.linux.arm64.rpm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo '${{ matrix.package_type }}' > ./assets/conf/package-type.txt

      - name: Dependency
        run: |
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0
          sudo apt-get update && sudo apt-get install -y fuse rpm

      - name: Build ${{ matrix.kind }} Package
        run: |
          cd ./assets/conf
          pupnet --runtime ${{ matrix.runtime }} --kind ${{ matrix.kind }} -o ${{ matrix.output }} -y --app-version ${{ needs.prepare.outputs.app_version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.kind }}-artifacts
          path: assets/conf/Deploy/OUT/${{ matrix.output }}

  win-exe:
    runs-on: windows-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'portable' > ./assets/conf/package-type.txt
        shell: bash

      - name: Build & Package
        shell: pwsh
        run: |
          cd ./src/SulfurLauncher.Desktop
          New-Item -ItemType Directory -Force -Path "../../dist"
          dotnet restore -r ${{ matrix.runtime }}
          dotnet publish -c Release -r ${{ matrix.runtime }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false /p:Version=${{ needs.prepare.outputs.app_version }} -o "../../dist" -p:DebugType=none -p:DebugSymbols=false
          cd "../../dist"
          Rename-Item -Path "SulfurLauncher.Desktop.exe" -NewName "SulfurLauncher.win.${{ matrix.arch }}.portable.exe" -Force
          Compress-Archive -Path "SulfurLauncher.win.${{ matrix.arch }}.portable.exe" -DestinationPath "../SulfurLauncher.win.${{ matrix.arch }}.portable.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-exe-win.${{ matrix.arch }}-artifacts
          path: ./SulfurLauncher.*.zip

  win-installer:
    runs-on: windows-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Dependencies
        run: |
          choco install innosetup -y
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0

      - name: Chinesize-InnoSetup
        run: Copy-Item "./assets/conf/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Default.isl" -Force

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'installer' > ./assets/conf/package-type.txt
        shell: bash

      - name: Build & Package
        shell: pwsh
        run: |
          cd ./assets/conf
          pupnet -r ${{ matrix.runtime }} -k setup -y -o SulfurLauncher.win.${{ matrix.arch }}.installer.exe --app-version ${{ needs.prepare.outputs.app_version }}
          ../../scripts/configure-windows-installer.ps1 -Runtime ${{ matrix.runtime }}
          Compress-Archive -Path "Deploy/OUT/SulfurLauncher.win.${{ matrix.arch }}.installer.exe" -DestinationPath "Deploy/OUT/SulfurLauncher.win.${{ matrix.arch }}.installer.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-installer-win.${{ matrix.arch }}-artifacts
          path: assets/conf/Deploy/OUT/SulfurLauncher.win.*.installer.zip

  mac-dmg:
    runs-on: macos-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
        include:
          - rid: osx-x64
            dmg_arch: x64
          - rid: osx-arm64
            dmg_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup CodeNet SDK (macOS 定制版 .NET)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODENET_VER="10.0.400"
          # 根据目标 RID 选择对应架构的 SDK
          case "${{ matrix.rid }}" in
            osx-x64)   ARCH="x64" ;;
            osx-arm64) ARCH="arm64" ;;
            *)         echo "未知 RID: ${{ matrix.rid }}" >&2; exit 1 ;;
          esac
          ASSET="dotnet-codenet-osx-${ARCH}.tar.gz"
          DEST="$RUNNER_TEMP/codenet"
          mkdir -p "$DEST"
          echo "从 Open-code-Studio/CodeNet 发布下载定制版 .NET SDK (sdk-v${CODENET_VER}, ${ARCH}) ..."
          gh release download "sdk-v${CODENET_VER}" -R Open-code-Studio/CodeNet -p "$ASSET" -D "$DEST"
          tar xzf "$DEST/$ASSET" -C "$DEST"
          echo "DOTNET_ROOT=$DEST/dotnet11x64" >> "$GITHUB_ENV"
          echo "$DEST/dotnet11x64" >> "$GITHUB_PATH"
          "$DEST/dotnet11x64/dotnet" --version
          "$DEST/dotnet11x64/dotnet" --info 2>/dev/null | grep Architecture

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'app' > ./assets/conf/package-type.txt

      - name: Build macOS App
        run: |
          cd ./src/SulfurLauncher.Desktop
          dotnet restore -r ${{ matrix.rid }}
          dotnet msbuild -t:BundleApp -p:RuntimeIdentifier=${{ matrix.rid }} -property:Configuration=Release -p:SelfContained=true

      # DotNet.Bundle 不支持 CFBundleURLTypes，sl:// 协议声明在打包后写入 Info.plist
      - name: Declare sl URL Scheme
        run: |
          PLIST="./src/SulfurLauncher.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/SulfurLauncher.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string cc.cangcang.sulfurlauncher" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLRole string Viewer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string sl" "$PLIST"

      - name: Package APP to ZIP
        run: |
          cd ./src/SulfurLauncher.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/
          /usr/bin/ditto -c -k --keepParent SulfurLauncher.app ../../../../../../../SulfurLauncher.osx.mac.${{ matrix.dmg_arch }}.app.zip

      # macOS Runner 预装的 aws/tap 未受信任，会导致 brew 输出警告，构建 DMG 前先移除
      - name: Untap Untrusted Homebrew Taps
        run: brew untap aws/tap || true

      - name: Build DMG
        uses: L-Super/create-dmg-actions@v1.1.0
        with:
          dmg_name: "SulfurLauncher.osx.mac.${{ matrix.dmg_arch }}"
          src_dir: "./src/SulfurLauncher.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/SulfurLauncher.app"

      - name: Build PKG
        run: |
          pkgbuild \
            --root "./src/SulfurLauncher.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/SulfurLauncher.app" \
            --install-location "/Applications/SulfurLauncher.app" \
            --identifier "studio.lively.sulfurlauncher" \
            --version "${{ needs.prepare.outputs.app_version }}" \
            --timestamp \
            "SulfurLauncher.osx.mac.${{ matrix.dmg_arch }}.pkg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-${{ matrix.dmg_arch }}-artifacts
          path: |
            ./SulfurLauncher.osx.mac.${{ matrix.dmg_arch }}.dmg
            ./SulfurLauncher.osx.mac.${{ matrix.dmg_arch }}.app.zip
            ./SulfurLauncher.osx.mac.${{ matrix.dmg_arch }}.pkg

  publish:
    needs: [prepare, linux-package, win-exe, win-installer, mac-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./SulfurLauncher.Release/
          merge-multiple: true

      - name: List Files
        run: ls -la ./SulfurLauncher.Release/

      - name: Generate Changelog
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          bash .github/scripts/generate-changelog.sh "$REPO_URL" > RELEASE_CHANGELOG.md
          if [ ! -s RELEASE_CHANGELOG.md ] || [ "$(wc -l < RELEASE_CHANGELOG.md)" -le 1 ]; then
            echo "本次构建与上次正式版相比没有新的提交" > RELEASE_CHANGELOG.md
          fi
          cat RELEASE_CHANGELOG.md

      - name: Delete Previous Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete publish-nightly --cleanup-tag -y || true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: publish-nightly
          name: "build-nightly-${{ needs.prepare.outputs.app_version }}-${{ github.run_id }}-${{ needs.prepare.outputs.commit }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_CHANGELOG.md
          files: |
            ./SulfurLauncher.Release/*.dmg
            ./SulfurLauncher.Release/*.zip
            ./SulfurLauncher.Release/*.pkg
            ./SulfurLauncher.Release/*.AppImage
            ./SulfurLauncher.Release/*.deb
            ./SulfurLauncher.Release/*.rpm

  aur:
    needs: [prepare, publish]
    uses: ./.github/workflows/publish-aur.yml
    with:
      pkgname: sulfurlauncher-nightly-bin
      tag: publish-nightly
      app_version: ${{ needs.prepare.outputs.app_version }}
      moving_tag: true
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
