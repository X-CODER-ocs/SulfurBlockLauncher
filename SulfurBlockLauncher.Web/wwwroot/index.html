<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SulfurBlockLauncher 硫磺方块启动器</title>
    <base href="/" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link href="SulfurBlockLauncher.Web.styles.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; height: 100%; }
        .sl-splash {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1.1rem;
            background: linear-gradient(160deg, #211e14 0%, #14130d 100%);
        }
        .sl-splash-logo { font-size: 2rem; font-weight: 800; letter-spacing: 1px; color: #ffe79a; }
        .sl-splash-spinner {
            width: 42px; height: 42px; border-radius: 50%;
            border: 4px solid rgba(232,185,35,.25); border-top-color: #e8b923;
            animation: sl-spin .8s linear infinite;
        }
        .sl-splash-text { color: #b9b29a; font-size: .9rem; }
        @@keyframes sl-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="sl-splash">
            <div class="sl-splash-logo">SulfurBlockLauncher</div>
            <div class="sl-splash-spinner" aria-hidden="true"></div>
            <div class="sl-splash-text">正在加载…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        页面出现了一点小问题。
        <a href="" class="reload">重新加载</a>
        <a class="dismiss">✕</a>
    </div>

    <script src="_content/Microsoft.FluentUI.AspNetCore.Components/Microsoft.FluentUI.AspNetCore.Components.lib.module.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
